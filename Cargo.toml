[workspace]
resolver = "2"
members = [
    "crates/nullroute-core",
    "crates/nullroute-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["mirai"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
owo-colors = { version = "4.1", features = ["supports-colors"] }
dirs = "5.0"
